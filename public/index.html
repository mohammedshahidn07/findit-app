<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FindIt — Campus Lost &amp; Found</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◎</span>
      <span class="brand-name">FindIt</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="report">Report an item</button>
      <button class="tab" data-view="browse">Browse found items</button>
    </nav>
  </header>

  <main>
    <section class="stats" id="stats">
      <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">items logged</span></div>
      <div class="stat"><span class="stat-value" id="stat-lost">0</span><span class="stat-label">lost reports</span></div>
      <div class="stat"><span class="stat-value" id="stat-found">0</span><span class="stat-label">found reports</span></div>
      <div class="stat"><span class="stat-value" id="stat-matched">0</span><span class="stat-label">matched</span></div>
    </section>

    <!-- REPORT VIEW -->
    <section class="view" id="view-report">
      <div class="panel">
        <div class="panel-head">
          <h1>Report an item</h1>
          <p>Lost something, or found something? Fill this once — matching happens automatically.</p>
        </div>

        <div class="segmented" id="type-toggle">
          <button class="seg active" data-type="lost">I lost something</button>
          <button class="seg" data-type="found">I found something</button>
        </div>

        <form id="item-form">
          <input type="hidden" id="item-type" value="lost" />

          <label class="field">
            <span>Photo</span>
            <input type="file" id="photo" accept="image/*" required />
          </label>

          <label class="field">
            <span>Description</span>
            <textarea id="description" rows="2" placeholder="e.g. Black JBL earbud case, small scratch on lid" required></textarea>
          </label>

          <div class="field-row">
            <label class="field">
              <span>Location</span>
              <input type="text" id="location" placeholder="e.g. Food Court, TT block" required />
            </label>
            <label class="field">
              <span id="time-label">When lost</span>
              <input type="datetime-local" id="datetime" required />
            </label>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">Submit lost report</button>
        </form>

        <div id="result" class="result hidden"></div>
      </div>
    </section>

    <!-- BROWSE VIEW -->
    <section class="view hidden" id="view-browse">
      <div class="panel-head">
        <h1>Found items</h1>
        <p>Items reported found on campus, not yet claimed.</p>
      </div>
      <div class="grid" id="found-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
